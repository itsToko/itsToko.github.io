<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div id="mainPanel">
    <div id="uInfo">
      <div id="pPic">
        <img class="pPic" src="assets/images/avatar-jessica.jpeg" alt="profile picture of user Jessica">
      </div>
      <div id="nameLoca">
            <h2 class="name">Jessica Randall</h2>
            <h5 class="loca">London, United Kingdom</h5>
      </div>
      <div id="uDesc">
          <p class="desc">"Front-end developer and avid reader."</p>
      </div>
      <div id="uLinks">
        <a href="https://github.com/itsToko" class="link " target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.frontendmentor.io/profile/itsToko" class="link" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>
        <a href="#" class="link target="_blank" rel="noopener noreferrer"">LinkedIn</a>
        <a href="#" class="link target="_blank" rel="noopener noreferrer"">Twitter</a>
        <a href="#" class="link target="_blank" rel="noopener noreferrer"">Instagram</a>
      </div>
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a  href="https://github.com/itsToko" target="_blank" rel="noopener noreferrer">Daniel Husbands</a>.
  </footer>
</body>
</html>
